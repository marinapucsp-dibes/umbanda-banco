<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC3KD27827x-aMNVUUK4Jsw0x0TyNmS_UA",
    authDomain: "caderno-espiritual.firebaseapp.com",
    projectId: "caderno-espiritual",
    storageBucket: "caderno-espiritual.firebasestorage.app",
    messagingSenderId: "351045677552",
    appId: "1:351045677552:web:578a18bf753afb26f16d35"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const DOC_REF = doc(db, "caderno", "dados");

  // Expõe funções para o código principal
  window._fbSave = async (data) => {
    try {
      // Imagens ficam apenas no localStorage por serem grandes demais
      const toSave = {...data, imagens: []};
      await setDoc(DOC_REF, toSave);
    } catch(e) { console.warn("Firebase save error:", e); }
  };

  window._fbLoad = async () => {
    try {
      const snap = await getDoc(DOC_REF);
      if(snap.exists()) return snap.data();
    } catch(e) { console.warn("Firebase load error:", e); }
    return null;
  };

  window._fbListen = (callback) => {
    return onSnapshot(DOC_REF, (snap) => {
      if(snap.exists()) callback(snap.data());
    });
  };

  window._fbReady = true;
  document.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap');
  :root {
    --bg:#f5f0e8;--surface:#ffffff;--surface2:#f0ebe0;--surface3:#e8e0d0;

  body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  h1,h2,h3,.guia-label{font-family:'Cinzel',serif;}
  header{background:linear-gradient(135deg,#efe8d8,#f5f0e8);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:100;}
  header h1{font-size:20px;color:var(--gold);letter-spacing:2px;display:flex;align-items:center;gap:8px;}
  nav{display:flex;overflow-x:auto;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 4px;position:sticky;top:56px;z-index:99;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto;border:none;background:none;color:var(--text3);font-family:'Cinzel',serif;font-size:11px;padding:0 12px;height:52px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(139,94,26,0.08);}
  .tab-content{display:none;padding:16px;padding-bottom:80px;}
  .tab-content.active{display:block;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-title{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);}
  .card-date{font-size:11px;color:var(--text3);}
  .card-body{font-size:14px;color:var(--text2);line-height:1.7;}
  .card-tag{display:inline-block;background:rgba(122,79,138,0.12);border:1px solid var(--border2);color:#7a4f8a;font-size:11px;padding:2px 10px;border-radius:20px;margin-bottom:8px;margin-right:4px;}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#6b4010);color:#fff;}

  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
  .btn-danger{background:transparent;border:1px solid rgba(192,57,43,0.4);color:#e06050;}
  .btn-success{background:rgba(39,174,96,0.1);border:1px solid rgba(39,174,96,0.35);color:#1a7a40;}
  .btn-full{width:100%;margin-top:12px;}
  .form-group{margin-bottom:14px;}
  label.form-label{display:block;font-size:12px;color:var(--text3);margin-bottom:5px;letter-spacing:0.5px;text-transform:uppercase;}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Lato',sans-serif;font-size:14px;padding:10px 12px;outline:none;transition:border-color 0.2s;}

  textarea{resize:vertical;min-height:90px;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:16px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;}
  .modal h3{font-family:'Cinzel',serif;color:var(--gold);font-size:16px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .guias-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .img-upload-area input{display:none;}
  .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .img-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1;}
  .img-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-item .img-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);border:none;color:#e06050;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .subtabs{display:flex;gap:4px;margin-bottom:16px;}
  .subtab{flex:1;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'Cinzel',serif;font-size:11px;padding:8px 4px;border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;}
  .subtab.active{background:rgba(139,94,26,0.1);border-color:var(--accent);color:var(--accent);}
  .fab{position:fixed;bottom:70px;right:16px;z-index:150;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6b4010);border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(139,94,26,0.35);display:flex;align-items:center;justify-content:center;transition:transform 0.2s;}
  .fab:active{transform:scale(0.92);}
  .section-title{font-family:'Cinzel',serif;font-size:12px;color:var(--accent2);letter-spacing:1px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border2);}
  .export-bar{background:var(--surface);border-top:1px solid var(--border);padding:8px 10px;position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;z-index:140;}
  .export-bar .btn{flex:1;font-size:11px;padding:9px 4px;}
  /* Nome list item */
  .nome-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .nome-item-text{flex:1;font-size:14px;color:var(--text);padding:8px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;text-align:left;transition:background 0.2s;}
  .nome-item-text:hover{background:var(--surface3);}
  /* Entidade detail */
  .entidade-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px;}
  .entidade-detail h4{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .ponto-img{width:100%;border-radius:8px;border:1px solid var(--border);margin-top:8px;max-height:200px;object-fit:contain;}
  /* Toggle */
  .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .toggle-label{font-size:13px;color:var(--text2);}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
  @media print{header,nav,.fab,.btn,.modal-bg,.export-bar,.card-actions{display:none!important;}body{background:white;color:#111;}.tab-content{display:block!important;}.guias-grid{grid-template-columns:repeat(4,1fr);}}
  ::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>

<script>
const GUIAS = [
  {id:'caboclo',   nome:'Caboclo',       icon:'🌿'},
  {id:'preto',     nome:'Preto Velho',   icon:'👴🏿'},
  {id:'preta',     nome:'Preta Velha',   icon:'👵🏿'},
  {id:'ere',       nome:'Erê',           icon:'🧒'},
  {id:'baiana',    nome:'Baiana',        icon:'💃'},
  {id:'boiadeiro', nome:'Boiadeiro',     icon:'🤠'},
  {id:'exu',       nome:'Exu',           icon:'⚡'},
  {id:'pomba',     nome:'Pomba-Gira',    icon:'🌹'},
  {id:'marinheiro',nome:'Marinheiro',    icon:'⚓'},
  {id:'ogum',      nome:'Linha de Ogum', icon:'🛡️'}
];

let DB = JSON.parse(localStorage.getItem('caderno_esp')||'{}');
DB.aprendizados = DB.aprendizados||[];
DB.receitas     = DB.receitas||[];
DB.mensagens    = DB.mensagens||[];
DB.pontos       = DB.pontos||[];
DB.imagens      = DB.imagens||[];
DB.trabalhos    = DB.trabalhos||[];
DB.guiaNomes    = DB.guiaNomes||{};

function save(){
  localStorage.setItem('caderno_esp',JSON.stringify(DB));
  if(window._fbReady) window._fbSave(DB);

function showSyncStatus(msg,color){
  let el=document.getElementById('sync-status');
  if(!el){el=document.createElement('div');el.id='sync-status';
    el.style.cssText='position:fixed;top:62px;right:10px;z-index:300;font-size:11px;padding:4px 10px;border-radius:20px;transition:opacity 0.5s;pointer-events:none';
    document.body.appendChild(el);}
  el.textContent=msg;el.style.background=color;el.style.color='#fff';el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},2500);
}

function applyRemote(remoto){
  const imgsLocais=DB.imagens||[];
  DB={...DB,...remoto,imagens:imgsLocais};
  DB.aprendizados=DB.aprendizados||[];DB.receitas=DB.receitas||[];
  DB.mensagens=DB.mensagens||[];DB.pontos=DB.pontos||[];
  DB.trabalhos=DB.trabalhos||[];DB.guiaNomes=DB.guiaNomes||{};DB.entidades=DB.entidades||{};
  Object.keys(DB.guiaNomes).forEach(k=>{
    if(typeof DB.guiaNomes[k]==='string')DB.guiaNomes[k]=DB.guiaNomes[k]?[DB.guiaNomes[k]]:[];
  });
  localStorage.setItem('caderno_esp',JSON.stringify(DB));
  renderTab(currentTab);renderGuias();
}

async function initFirebase(){
  if(!window._fbReady){document.addEventListener('firebase-ready',initFirebase);return;}
  showSyncStatus('🔄 Sincronizando...','#8b5e1a');
  const remoto=await window._fbLoad();
  if(remoto){applyRemote(remoto);showSyncStatus('✓ Sincronizado','#27ae60');}
  else showSyncStatus('☁️ Nuvem vazia','#9a8a70');
  window._fbListen((remoto)=>{applyRemote(remoto);showSyncStatus('✓ Atualizado','#27ae60');});
}

let currentTab='guias', currentSubtab='msg';
let currentEntidadeGuia=null, currentEntidadeIdx=null, riscadoImgData=null;

// NAV
function showTab(id){
  currentTab=id;
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  const tabs=['guias','receitas','mensagens','trabalhos','galeria'];
  const idx=tabs.indexOf(id);
  if(idx>=0)document.querySelectorAll('nav button')[idx].classList.add('active');
  renderTab(id);
}

function showSubtab(sub,btn){
  currentSubtab=sub;
  document.querySelectorAll('.subtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('msg-panel').style.display=sub==='msg'?'':'none';
  document.getElementById('pontos-panel').style.display='none';
  document.getElementById('aprend-panel').style.display=sub==='aprend'?'':'none';
  renderMsg();
}

function renderTab(id){
  if(id==='guias')     renderGuias();
  if(id==='receitas')  renderRec();
  if(id==='mensagens') renderMsg();
  if(id==='trabalhos') renderTrab();
  if(id==='galeria')   renderImgs();
}

// GUIAS
function renderGuias(){
  const grid=document.getElementById('guias-grid');
  grid.innerHTML=GUIAS.map(g=>{
    const nomes=DB.guiaNomes[g.id]||[];
    const preview=nomes.length?nomes.slice(0,3).join(' · '):'';
    return `<div class="guia-card" onclick="showGuiaDetail('${g.id}')">
      <div class="guia-icon">${g.icon}</div>
      <div class="guia-label">${g.nome}</div>
      ${preview?`<div class="guia-nomes-preview">${preview}</div>`:''}
    </div>`;
  }).join('');
}

function showGuiaDetail(id){
  const g=GUIAS.find(x=>x.id===id);
  const nomes=DB.guiaNomes[id]||[];
  const recs=DB.receitas.filter(r=>r.guia&&r.guia.toLowerCase().includes(g.nome.toLowerCase()));
  const msgs=DB.mensagens.filter(m=>m.guia&&m.guia.toLowerCase().includes(g.nome.toLowerCase()));
  const ponts=DB.pontos.filter(p=>p.guia&&p.guia.toLowerCase().includes(g.nome.toLowerCase()));
  const d=document.getElementById('guia-detail');

  const nomesHtml=nomes.length?nomes.map((n,i)=>`
    <div class="nome-item">
      <button class="nome-item-text" onclick="openEntidade('${id}',${i})">${n}</button>
      <button class="btn btn-danger btn-sm" onclick="delGuiaNome('${id}',${i})">✕</button>
    </div>`).join('')
    :`<p style="font-size:13px;color:var(--text3);margin-bottom:8px">Nenhum nome cadastrado ainda.</p>`;

  let html=`
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <span style="font-size:28px">${g.icon}</span>
    <span style="font-family:Cinzel;font-size:15px;color:var(--gold)">${g.nome}</span>
  </div>
  <label class="form-label">Nomes / Entidades</label>
  <div id="nomes-list-${id}" style="margin-bottom:10px">${nomesHtml}</div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <input type="text" id="guia-nome-new-${id}" placeholder="Ex: Caboclo Sete Flechas..." style="flex:1" onkeydown="if(event.key==='Enter')addGuiaNome('${id}')">
    <button class="btn btn-primary btn-sm" onclick="addGuiaNome('${id}')">+ Adicionar</button>
  </div>`;

  if(msgs.length){html+=`<p class="section-title">Mensagens</p>`;msgs.forEach(m=>{html+=miniCard(m.data,m.guia,m.texto,'msg');});}
  if(recs.length){html+=`<p class="section-title">Receitas</p>`;recs.forEach(r=>{html+=miniCard(r.data,r.guia,r.nome,'rec');});}
  if(ponts.length){html+=`<p class="section-title">Pontos Cantados</p>`;ponts.forEach(p=>{html+=miniCard(p.data,p.guia,p.texto,'ponto');});}
  d.innerHTML=html;
  d.scrollIntoView({behavior:'smooth',block:'start'});
}

function addGuiaNome(id){
  const input=document.getElementById('guia-nome-new-'+id);
  const val=input.value.trim();
  if(!val){input.focus();return;}
  if(!DB.guiaNomes[id])DB.guiaNomes[id]=[];
  DB.guiaNomes[id].push(val);
  save(); input.value=''; showGuiaDetail(id); renderGuias();
}

function delGuiaNome(id,idx){
  if(!confirm('Remover este nome?'))return;
  DB.guiaNomes[id].splice(idx,1);
  if(DB.entidades[id])delete DB.entidades[id][idx];
  save(); showGuiaDetail(id); renderGuias();
}

// ENTIDADE MODAL
function openEntidade(guiaId,idx){
  currentEntidadeGuia=guiaId; currentEntidadeIdx=idx; riscadoImgData=null;
  const nome=DB.guiaNomes[guiaId][idx];
  const ent=(DB.entidades[guiaId]&&DB.entidades[guiaId][idx])||{};
  document.getElementById('ent-title').textContent='✦ '+nome;
  document.getElementById('ent-linha').value=ent.linha||'';
  document.getElementById('ent-espec').value=ent.espec||'';
  document.getElementById('ent-ponto').value=ent.ponto||'';
  document.getElementById('ent-info').value=ent.info||'';
  const hasRiscado=!!ent.riscado;
  document.getElementById('ent-riscado-check').checked=hasRiscado;
  document.getElementById('ent-riscado-area').style.display=hasRiscado?'':'none';
  const prev=document.getElementById('ent-riscado-preview');
  if(ent.riscadoImg){prev.src=ent.riscadoImg;prev.style.display='';riscadoImgData=ent.riscadoImg;}
  else{prev.style.display='none';}
  openModal('modal-entidade');
}

function toggleRiscadoUpload(){
  const checked=document.getElementById('ent-riscado-check').checked;
  document.getElementById('ent-riscado-area').style.display=checked?'':'none';
}

function handleRiscadoImg(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    riscadoImgData=ev.target.result;
    const prev=document.getElementById('ent-riscado-preview');
    prev.src=riscadoImgData; prev.style.display='';
  };
  reader.readAsDataURL(file);
}

function saveEntidade(){
  const id=currentEntidadeGuia, idx=currentEntidadeIdx;
  if(!DB.entidades[id])DB.entidades[id]={};
  const hasRiscado=document.getElementById('ent-riscado-check').checked;
  DB.entidades[id][idx]={
    linha:document.getElementById('ent-linha').value.trim(),
    espec:document.getElementById('ent-espec').value.trim(),
    ponto:document.getElementById('ent-ponto').value.trim(),
    riscado:hasRiscado,
    riscadoImg:hasRiscado?riscadoImgData:null,
    info:document.getElementById('ent-info').value.trim()
  };
  save(); closeModal('modal-entidade'); showGuiaDetail(id);
}

function miniCard(data,guia,texto,tipo){
  const icons={msg:'💬',rec:'🌿',ponto:'🎵'};
  return `<div class="card" style="padding:10px 12px;margin-bottom:8px">
    <span style="font-size:12px">${icons[tipo]||''}</span>
    <span style="font-size:11px;color:var(--text3);margin-left:4px">${formatDate(data)}</span>
    ${guia?`<span class="card-tag" style="margin-left:6px">${guia}</span>`:''}
    <p style="font-size:13px;color:var(--text2);margin-top:4px;white-space:pre-wrap;word-break:break-word">${truncate(texto,120)}</p>
  </div>`;
}

function saveAprend(){
  const data=document.getElementById('a-data').value;
  const guia=document.getElementById('a-guia').value.trim();
  const texto=document.getElementById('a-texto').value.trim();
  if(!texto){alert('Escreva algo no campo de aprendizado.');return;}
  const editId=document.getElementById('a-data').dataset.editId;
  if(editId){
    const item=DB.aprendizados.find(a=>a.id==editId);
    if(item){item.data=data;item.guia=guia;item.texto=texto;}
    delete document.getElementById('a-data').dataset.editId;
  }else{
    DB.aprendizados.push({id:Date.now(),data,guia,texto});
  }
  save();closeModal('modal-aprend');renderAprend();
}

  const a=DB.aprendizados.find(x=>x.id===id);

  DB.aprendizados=DB.aprendizados.filter(a=>a.id!==id);

// IMAGENS
let pendingImages=[],pendingIdx=0;
function handleImages(e){
  pendingImages=Array.from(e.target.files);pendingIdx=0;processNextImage();e.target.value='';
}
function processNextImage(){
  if(pendingIdx>=pendingImages.length)return;
  const file=pendingImages[pendingIdx];
  const reader=new FileReader();
  reader.onload=ev=>{
    document.getElementById('img-cap-input').value=file.name.replace(/\.[^.]+$/,'');
    document.getElementById('modal-img-cap').dataset.imgData=ev.target.result;
    openModal('modal-img-cap');
  };
  reader.readAsDataURL(file);
}
function skipImgCap(){addImage(document.getElementById('modal-img-cap').dataset.imgData,'');}
function saveImgCap(){addImage(document.getElementById('modal-img-cap').dataset.imgData,document.getElementById('img-cap-input').value.trim());}
function addImage(data,caption){
  DB.imagens.push({id:Date.now(),data,caption});save();closeModal('modal-img-cap');pendingIdx++;renderImgs();
  if(pendingIdx<pendingImages.length)setTimeout(processNextImage,300);
}
function renderImgs(){
  const grid=document.getElementById('img-grid');
  if(!DB.imagens.length){grid.innerHTML='';return;}
  grid.innerHTML=DB.imagens.map(img=>`
    <div class="img-item">
      <img src="${img.data}" alt="${img.caption||''}">
      <button class="img-del" onclick="delImg(${img.id})">✕</button>
      ${img.caption?`<div style="font-size:11px;color:var(--text2);padding:4px 6px;background:var(--surface2);border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${img.caption}</div>`:''}
    </div>`).join('');
}
function delImg(id){if(!confirm('Remover?'))return;DB.imagens=DB.imagens.filter(i=>i.id!==id);save();renderImgs();}

// FAB
function openAddModal(){
  const today=new Date().toISOString().split('T')[0];
  if(currentTab==='receitas'){
    document.getElementById('r-data').value=today;
    document.getElementById('r-guia').value='';
    document.getElementById('r-nome').value='';
    document.getElementById('r-itens').value='';
    document.getElementById('r-preparo').value='';
    delete document.getElementById('r-data').dataset.editId;
    openModal('modal-rec');
  }else if(currentTab==='mensagens'){
    if(currentSubtab==='aprend'){
      document.getElementById('a-data').value=today;
      document.getElementById('a-guia').value='';
      document.getElementById('a-texto').value='';
      delete document.getElementById('a-data').dataset.editId;
      openModal('modal-aprend');
    }else{
      document.getElementById('m-data').value=today;
      document.getElementById('m-guia').value='';
      document.getElementById('m-texto').value='';
      delete document.getElementById('m-data').dataset.editId;
      document.getElementById('modal-msg-title').textContent='💬 Nova Mensagem';
      document.getElementById('m-label').textContent='Mensagem';
      openModal('modal-msg');
    }
  }else if(currentTab==='trabalhos'){
    document.getElementById('t-data').value=today;
    document.getElementById('t-gira').value='';
    document.getElementById('t-guia-chefe').value='';
    document.getElementById('t-guia-inc').value='';
    document.getElementById('t-impressoes').value='';
    delete document.getElementById('t-data').dataset.editId;
    openModal('modal-trab');
  }else if(currentTab==='galeria'){
    document.getElementById('img-input').click();
  }else{
    alert('Selecione uma aba para adicionar registros.');
  }
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);});
});

// EXPORT
function exportPDF(){window.print();}
function exportJSON(){
  const str=JSON.stringify(DB,null,2);
  const blob=new Blob([str],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='caderno_espiritual_backup.json';a.click();URL.revokeObjectURL(url);
}
function importJSON(){document.getElementById('import-file').click();}
function doImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(confirm('Restaurar backup? Os dados atuais serão substituídos.')){
        DB=data;
        DB.aprendizados=DB.aprendizados||[];DB.receitas=DB.receitas||[];
        DB.mensagens=DB.mensagens||[];DB.pontos=DB.pontos||[];
        DB.imagens=DB.imagens||[];DB.trabalhos=DB.trabalhos||[];
        DB.guiaNomes=DB.guiaNomes||{};DB.entidades=DB.entidades||{};
        Object.keys(DB.guiaNomes).forEach(k=>{
          if(typeof DB.guiaNomes[k]==='string')DB.guiaNomes[k]=DB.guiaNomes[k]?[DB.guiaNomes[k]]:[];
        });
        save();renderTab(currentTab);renderGuias();alert('Backup restaurado!');
      }
    }catch(err){alert('Arquivo inválido.');}
  };
  reader.readAsText(file);e.target.value='';
}

// HELPERS
function formatDate(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}
function truncate(str,n){if(!str)return'';return str.length>n?str.slice(0,n)+'…':str;}

renderImgs();
initFirebase();
